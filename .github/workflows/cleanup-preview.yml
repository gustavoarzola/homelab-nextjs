# Al cerrar (merge o no) un PR, borra los deployments de Preview de Vercel de esa rama.
#
# La integración nativa Vercel↔Neon borra la rama `preview/<rama-git>` de Neon cuando se borra
# su último deployment, así que esto también limpia Neon. Sin esto, Vercel retiene los previews
# por meses, las ramas se acumulan y el plan Free de Neon (10 ramas) rechaza nuevos previews.
#
# Configuración (GitHub → Settings → Secrets and variables → Actions):
#   secret:    VERCEL_TOKEN
#   variables: VERCEL_PROJECT_ID, VERCEL_TEAM_ID
# Si falta alguno, el job se salta con un aviso (no falla).

name: Cleanup preview

on:
  pull_request:
    types: [closed]

permissions: {}

concurrency:
  group: cleanup-preview-${{ github.head_ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    # Los PRs desde forks no reciben secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GIT_BRANCH: ${{ github.head_ref }}
    steps:
      - name: Borrar deployments de Preview en Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN}" ] || [ -z "${VERCEL_PROJECT_ID}" ] || [ -z "${VERCEL_TEAM_ID}" ]; then
            echo "::warning::Falta VERCEL_TOKEN / VERCEL_PROJECT_ID / VERCEL_TEAM_ID; se omite Vercel."
            exit 0
          fi
          if [ "${GIT_BRANCH}" = "main" ]; then
            echo "Rama main: no se toca."; exit 0
          fi
          api="https://api.vercel.com"
          auth=(-H "Authorization: Bearer ${VERCEL_TOKEN}")

          ids=$(curl -fsS -G "${auth[@]}" "${api}/v6/deployments" \
            --data-urlencode "projectId=${VERCEL_PROJECT_ID}" \
            --data-urlencode "teamId=${VERCEL_TEAM_ID}" \
            --data-urlencode "branch=${GIT_BRANCH}" \
            --data-urlencode "limit=100" \
            | jq -r '.deployments[] | select(.target != "production") | .uid')

          if [ -z "${ids}" ]; then
            echo "No hay deployments de Preview para ${GIT_BRANCH}."; exit 0
          fi
          for id in ${ids}; do
            echo "Borrando deployment ${id}"
            curl -fsS -X DELETE "${auth[@]}" "${api}/v13/deployments/${id}?teamId=${VERCEL_TEAM_ID}" > /dev/null
          done
